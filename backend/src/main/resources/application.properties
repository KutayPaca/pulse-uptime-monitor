spring.application.name=backend

# PostgreSQL Bağlantısı (Docker'da kurduğumuz pulse-postgres)
spring.datasource.url=jdbc:postgresql://localhost:5432/pulse_db
spring.datasource.username=postgres
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Sihri (Tabloları bizim için otomatik yönetsin)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Java 21 Sanal İş Parçacıkları (Virtual Threads) Aktif
spring.threads.virtual.enabled=true

# Redis Konfigürasyonu
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=60000